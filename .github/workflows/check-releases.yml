# Watches Microsoft's .NET release metadata and acts on what it finds:
# mechanical changes become PRs, judgment calls become issues.
#
# There is no hardcoded channel list. An earlier version pinned
# `matrix: channel: ["10.0"]`, which meant .NET 11 and 12 would ship and this
# workflow would keep reporting success while being permanently blind to them.
# What the feedstock tracks is declared in channels.json instead, and anything
# the bot cannot decide gets escalated as a GitHub issue rather than silently
# dropped.
#
# Why this lives outside the feedstock: a conda-forge feedstock's .gitignore is
# `*` / `!/conda-forge.yml` / `!/recipe/**` / `!/.ci_support/**`, with the note
# "Everything else is managed by the conda-smithy rerender process." A helper
# script or workflow cannot be hosted at a feedstock root.
name: check-dotnet-releases

on:
  schedule:
    # Mondays. Deliberately off the hour -- every cron everyone writes lands on
    # :00 and this job has no reason to join the stampede.
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only: no PR, no issues"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  FEEDSTOCK: acesnik/dotnet-feedstock
  UPSTREAM: conda-forge/dotnet-feedstock

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      bumps: ${{ steps.plan.outputs.bumps }}
      bump_count: ${{ steps.plan.outputs.bump_count }}
      issue_count: ${{ steps.plan.outputs.issue_count }}
      issue_repo: ${{ steps.plan.outputs.issue_repo }}
      transition: ${{ steps.plan.outputs.transition }}
      has_transition: ${{ steps.plan.outputs.has_transition }}
    steps:
      - uses: actions/checkout@v7

      # No token here on purpose: the feedstock is public, and planning only
      # reads. The token is needed solely by the bump job, which pushes.
      #
      # fetch-depth 0 and no `ref`: every tracked line lives on its own branch
      # (main for 10.0, v8 for 8.0), and plan.py reads each one with
      # `git show <ref>:recipe/meta.yaml` rather than checking anything out.
      - name: Check out the feedstock (read-only, all branches)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM }}
          path: feedstock
          fetch-depth: 0

      - name: Plan
        id: plan
        run: |
          python3 scripts/plan.py channels.json feedstock > plan.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open("plan.json"))
          bumps = p.get("bumps", [])
          # Compact single-line JSON: this feeds `fromJson` into the bump job's
          # matrix, so each stale line gets an independent PR against its own
          # branch and concurrent bumps cannot conflict.
          print("bumps=" + json.dumps(bumps, separators=(",", ":")))
          print(f"bump_count={len(bumps)}")
          print(f"issue_count={len(p.get('issues', []))}")
          print(f"issue_repo={p.get('issue_repo','')}")
          tr = p.get("transition")
          print("transition=" + json.dumps(tr or {}, separators=(",", ":")))
          print(f"has_transition={'true' if tr else 'false'}")
          PY
          # Human-readable rundown in the run summary, so a quiet week is still
          # legible rather than just a green tick.
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p = json.load(open("plan.json"))
          print(f"## Plan\n")
          print(f"Policy `{p['policy']}`.\n")
          print("| line | branch | recipe | latest | phase | |")
          print("|---|---|---|---|---|---|")
          for l in p["lines"]:
              mark = "**STALE**" if l["stale"] else "current"
              print(f"| {l['channel']} | `{l['branch']}` | `{l['current_sdk']}` "
                    f"| `{l['latest_sdk']}` | {l['support_phase']} | {mark} |")
          print(f"\n### Architectures\n")
          print(f"- packaged: `{'`, `'.join(p['rids']['packaged'])}`")
          print(f"- offered but not packaged:\n")
          for s in p["rids"]["skipped"]:
              print(f"  - `{s['rid']}` — {s['reason']}")
          tr = p.get("transition")
          if tr:
              print(f"\n### Line transition proposed\n")
              print(f"- **{tr['to_channel']}** ({tr['to_release_type'].upper()}, "
                    f"SDK `{tr['to_sdk']}`) has reached GA")
              print(f"- cut `{tr['cut_branch']}` from `{tr['from_branch']}` so "
                    f"{tr['from_channel']} stays patchable, then move "
                    f"`{tr['from_branch']}` to {tr['to_channel']}")
          notes = p.get("notices", [])
          if notes:
              # Seen-and-deliberately-skipped, so it is distinguishable from
              # never-looked. Notices never open anything.
              print(f"\n### Noted, no action\n")
              for n in notes:
                  print(f"- {n}")
          iss = p.get("issues", [])
          print(f"\n### Escalations: {len(iss)}\n")
          for i in iss:
              print(f"- **{i['title']}**")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: plan
          path: plan.json
          if-no-files-found: error

  bump:
    needs: plan
    if: needs.plan.outputs.bump_count != '0' && inputs.dry_run != true
    runs-on: ubuntu-latest
    strategy:
      # One job per stale line, each targeting its own branch. Independent, so a
      # failure on 8.0 does not block 10.0, and their PRs never conflict.
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.plan.outputs.bumps) }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out the feedstock fork
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FEEDSTOCK }}
          path: feedstock
          token: ${{ secrets.FEEDSTOCK_TOKEN }}
          fetch-depth: 0

      - name: Base on upstream ${{ matrix.branch }}, not on a possibly-stale fork
        working-directory: feedstock
        run: |
          # Each line is based on ITS OWN upstream branch. Basing everything on
          # main would rewrite an older line's recipe to the newest line's
          # version, which is the opposite of maintaining it.
          git remote add upstream "https://github.com/${{ env.UPSTREAM }}.git"
          git fetch -q upstream "${{ matrix.branch }}"
          git checkout -q -B "ci-base-${{ matrix.channel }}" \
            "upstream/${{ matrix.branch }}"
          echo "based on upstream/${{ matrix.branch }} $(git rev-parse --short HEAD)"

      - name: Rewrite meta.yaml
        id: write
        working-directory: feedstock
        run: |
          # Only now do we pay for ~1 GB of downloads: the plan job already
          # confirmed via version comparison that there is something to hash.
          python3 ../scripts/update-dotnet-version.py \
            --channel "${{ matrix.channel }}" \
            --write --summary-json ../summary.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("../summary.json"))
          print(f"sdk={d['sdk_version']}")
          print(f"runtime={d['runtime_version']}")
          print(f"security={str(d['security']).lower()}")
          print(f"branch=autobump/{d['sdk_version']}")
          PY

      - name: Skip if that branch already exists
        id: exists
        working-directory: feedstock
        run: |
          # One branch per SDK version: re-runs are idempotent and a branch a
          # human is working on is never force-pushed over.
          if git ls-remote --exit-code --heads origin \
               "${{ steps.write.outputs.branch }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.write.outputs.branch }} exists already"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show the diff
        working-directory: feedstock
        run: |
          git --no-pager diff
          { echo '## Version bump'; echo '```diff'; git --no-pager diff; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Push and open the PR
        if: steps.exists.outputs.exists == 'false'
        working-directory: feedstock
        env:
          GH_TOKEN: ${{ secrets.FEEDSTOCK_TOKEN }}
          SDK: ${{ steps.write.outputs.sdk }}
          RUNTIME: ${{ steps.write.outputs.runtime }}
          SECURITY: ${{ steps.write.outputs.security }}
          BRANCH: ${{ steps.write.outputs.branch }}
        run: |
          git config user.name  "dotnet-autobump"
          git config user.email "noreply@github.com"
          git checkout -q -b "$BRANCH"
          git add recipe/meta.yaml
          git commit -q -m "$SDK / runtime $RUNTIME"
          git push -q origin "$BRANCH"

          title="$SDK / runtime $RUNTIME"
          [ "$SECURITY" = "true" ] && title="$title (security release)"
          python3 ../scripts/render_pr_body.py ../summary.json > ../body.md

          # --base is the line's own branch, not main: a 8.0 bump belongs on v8.
          url=$(gh pr create --repo "${{ env.UPSTREAM }}" \
                  --head "${FEEDSTOCK%%/*}:$BRANCH" \
                  --base "${{ matrix.branch }}" \
                  --title "$title" --body-file ../body.md)
          echo "opened $url"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

          # Must be a COMMENT, not part of the PR body: conda-forge documents the
          # trigger as a comment on the PR (rerenders the head branch and pushes
          # a commit) or an issue title/comment. The description is not a
          # documented trigger.
          #
          # Consequence: the rerender's diff lands without review, which can be
          # large when a feedstock's rendering is stale. Drop this if you would
          # rather inspect first.
          gh pr comment "$url" --body "@conda-forge-admin, please rerender"
        # FEEDSTOCK is owner/repo; ${FEEDSTOCK%%/*} is the fork owner for --head.

  notify:
    needs: plan
    if: needs.plan.outputs.issue_count != '0' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: plan

      - name: File issues for judgment calls
        env:
          GH_TOKEN: ${{ secrets.FEEDSTOCK_TOKEN }}
          ISSUE_REPO: ${{ needs.plan.outputs.issue_repo }}
        run: |
          # Dedup on a hidden marker rather than the title, so retitling an issue
          # by hand doesn't make the bot open a duplicate next week.
          gh issue list --repo "$ISSUE_REPO" --state all --limit 200 \
            --json number,body > existing.json
          python3 - <<'PY' > todo.json
          import json
          existing = json.load(open("existing.json"))
          seen = {
              line.split("autobump-key:")[1].split("-->")[0].strip()
              for i in existing for line in (i.get("body") or "").splitlines()
              if "autobump-key:" in line
          }
          plan = json.load(open("plan.json"))
          todo = [i for i in plan.get("issues", []) if i["key"] not in seen]
          print(json.dumps(todo, indent=2))
          for i in plan.get("issues", []):
              if i["key"] in seen:
                  print(f"::notice::already filed: {i['key']}", file=__import__("sys").stderr)
          PY
          python3 - <<'PY'
          import json, subprocess, os
          todo = json.load(open("todo.json"))
          repo = os.environ["ISSUE_REPO"]
          for i in todo:
              body = i["body"] + f"\n\n<!-- autobump-key: {i['key']} -->\n"
              body += "\n_Filed automatically by dotnet-feedstock-autobump. " \
                      "Mechanical changes become PRs; this needed a human._\n"
              out = subprocess.run(
                  ["gh", "issue", "create", "--repo", repo,
                   "--title", i["title"], "--body", body],
                  capture_output=True, text=True,
              )
              print(out.stdout.strip() or out.stderr.strip())
          print(f"filed {len(todo)} issue(s)")
          PY

  transition:
    needs: plan
    if: needs.plan.outputs.has_transition == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    env:
      TR: ${{ needs.plan.outputs.transition }}
    steps:
      - uses: actions/checkout@v7

      - name: Unpack the transition
        id: tr
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          t = json.loads(os.environ["TR"])
          for k in ("to_channel","to_sdk","to_release_type","from_channel",
                    "from_branch","cut_branch"):
              print(f"{k}={t[k]}")
          print(f"cut_upstream={str(t['cut_branch_upstream']).lower()}")
          PY

      # Step 1 of 3: preserve the outgoing line. This is the only action here not
      # mediated by a PR, because a ref cannot be created by one. It is additive --
      # a new ref at main's current tip, never a force-update -- and it aborts if
      # the branch already exists. Skipping this is how 9.0 got orphaned: it
      # shipped from main, 10.0 took over, and no v9 branch was ever cut.
      - name: Cut ${{ steps.tr.outputs.cut_branch }} to keep ${{ steps.tr.outputs.from_channel }} patchable
        id: cut
        env:
          GH_TOKEN: ${{ secrets.FEEDSTOCK_TOKEN }}
        run: |
          set -euo pipefail
          CUT='${{ steps.tr.outputs.cut_branch }}'
          FROM='${{ steps.tr.outputs.from_branch }}'
          TARGET_REPO='${{ env.UPSTREAM }}'
          [ '${{ steps.tr.outputs.cut_upstream }}' = 'true' ] || TARGET_REPO='${{ env.FEEDSTOCK }}'

          if gh api "repos/$TARGET_REPO/git/ref/heads/$CUT" >/dev/null 2>&1; then
            echo "::warning::$CUT already exists on $TARGET_REPO - not touching it"
            echo "cut=existed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Always cut from UPSTREAM's tip, even when pushing the ref to the fork:
          # the fork may lag, and the point is to snapshot what main ships now.
          SHA=$(gh api "repos/${{ env.UPSTREAM }}/git/ref/heads/$FROM" --jq .object.sha)
          echo "cutting $CUT from ${{ env.UPSTREAM }}@$FROM ($SHA) on $TARGET_REPO"
          gh api -X POST "repos/$TARGET_REPO/git/refs" \
            -f ref="refs/heads/$CUT" -f sha="$SHA" >/dev/null
          echo "cut=created" >> "$GITHUB_OUTPUT"
          echo "repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"
          { echo "### Cut \`$CUT\`"; echo;
            echo "From \`${{ env.UPSTREAM }}@$FROM\` at \`$SHA\`, on \`$TARGET_REPO\`.";
          } >> "$GITHUB_STEP_SUMMARY"

      # Step 2 of 3: move the primary line. An ordinary PR, so a human merges it.
      - name: Check out the feedstock fork
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FEEDSTOCK }}
          path: feedstock
          token: ${{ secrets.FEEDSTOCK_TOKEN }}
          fetch-depth: 0

      - name: Open the ${{ steps.tr.outputs.to_channel }} PR against ${{ steps.tr.outputs.from_branch }}
        env:
          GH_TOKEN: ${{ secrets.FEEDSTOCK_TOKEN }}
          TO_CH: ${{ steps.tr.outputs.to_channel }}
          FROM_BR: ${{ steps.tr.outputs.from_branch }}
          CUT: ${{ steps.tr.outputs.cut_branch }}
          FROM_CH: ${{ steps.tr.outputs.from_channel }}
          CUT_STATE: ${{ steps.cut.outputs.cut }}
        working-directory: feedstock
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${{ env.UPSTREAM }}.git"
          git fetch -q upstream "$FROM_BR"
          git checkout -q -B "ci-transition" "upstream/$FROM_BR"

          python3 ../scripts/update-dotnet-version.py \
            --channel "$TO_CH" --write --summary-json ../summary.json
          SDK=$(python3 -c "import json;print(json.load(open('../summary.json'))['sdk_version'])")
          BR="autobump/$SDK"

          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            echo "::notice::$BR exists already - stopping"; exit 0
          fi

          git config user.name  "dotnet-autobump"
          git config user.email "noreply@github.com"
          git checkout -q -b "$BR"
          git add recipe/meta.yaml
          git commit -q -m "$TO_CH: move to $SDK"
          git push -q origin "$BR"

          python3 ../scripts/render_pr_body.py ../summary.json > ../body.md
          {
            echo
            echo "---"
            echo
            echo "### This moves the primary line from $FROM_CH to $TO_CH"
            echo
            if [ "$CUT_STATE" = "created" ]; then
              echo "\`$CUT\` has been cut from \`$FROM_BR\`, so **$FROM_CH stays"
              echo "patchable** and keeps receiving security updates. Add"
              echo "\`\"$FROM_CH\": \"$CUT\"\` to \`channels.json\` in the autobump repo"
              echo "(a PR for that follows) so it is bumped from now on."
            elif [ "$CUT_STATE" = "existed" ]; then
              echo "\`$CUT\` already existed and was left untouched."
            fi
            echo
            echo "Verified mechanical: rendering this recipe at the new version needs"
            echo "no edits beyond the two version variables, because \`framework\`"
            echo "derives the target framework and the metapackage pins follow"
            echo "\`runtime_version\`."
          } >> ../body.md

          url=$(gh pr create --repo "${{ env.UPSTREAM }}" \
                  --head "${FEEDSTOCK%%/*}:$BR" --base "$FROM_BR" \
                  --title "$TO_CH: move primary line to $SDK" \
                  --body-file ../body.md)
          echo "opened $url"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$url" --body "@conda-forge-admin, please rerender"

      # Step 3 of 3: keep the declared policy honest. channels.json is
      # human-owned, so this is a PR against this repo rather than a direct edit.
      - name: PR channels.json so tracked reflects the new layout
        if: steps.cut.outputs.cut == 'created'
        env:
          GH_TOKEN: ${{ secrets.FEEDSTOCK_TOKEN }}
          FROM_CH: ${{ steps.tr.outputs.from_channel }}
          TO_CH: ${{ steps.tr.outputs.to_channel }}
          CUT: ${{ steps.tr.outputs.cut_branch }}
          FROM_BR: ${{ steps.tr.outputs.from_branch }}
        run: |
          set -euo pipefail
          BR="tracked/$TO_CH"
          git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1 && {
            echo "::notice::$BR exists already"; exit 0; }
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          p = Path("channels.json"); t = p.read_text()
          frm, to, cut, frmbr = (os.environ[k] for k in
                                 ("FROM_CH","TO_CH","CUT","FROM_BR"))
          # Textual edit, not a json round-trip: channels.json carries _comment
          # keys and formatting that document every decision, and rewriting it
          # programmatically would strip all of that.
          old = re.search(r'"tracked":\s*\{[^}]*\}', t).group(0)
          entries = re.findall(r'"([\d.]+)":\s*"([^"]+)"', old)
          m = {c: b for c, b in entries}
          m[frm] = cut
          m[to] = frmbr
          body = ",\n".join(
              f'    "{c}": "{m[c]}"'
              for c in sorted(m, key=lambda x: [int(i) for i in x.split(".")],
                              reverse=True))
          p.write_text(t.replace(old, '"tracked": {\n' + body + "\n  }"))
          print(json.dumps(m, indent=2))
          PY
          git config user.name  "dotnet-autobump"
          git config user.email "noreply@github.com"
          git checkout -q -b "$BR"
          git add channels.json
          git commit -q -m "tracked: $TO_CH takes $FROM_BR, $FROM_CH moves to $CUT"
          git push -q origin "$BR"
          # Body via a file: an inline multi-line --body dedents out of the YAML
          # block scalar and breaks the workflow parse.
          cat > ../tracked-body.md <<EOF
          Follows the line transition. \`$CUT\` was cut from \`$FROM_BR\`, so
          $FROM_CH is bumped from there now, and $TO_CH takes over \`$FROM_BR\`.

          Merge after the feedstock PR lands, so the plan does not propose a
          $TO_CH bump against a branch that still ships $FROM_CH.
          EOF
          sed -i 's/^          //' ../tracked-body.md
          gh pr create --repo "${{ github.repository }}" --head "$BR" --base main \
            --title "tracked: $TO_CH on $FROM_BR, $FROM_CH on $CUT" \
            --body-file ../tracked-body.md
